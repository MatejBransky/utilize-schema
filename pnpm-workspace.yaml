packages:
  - packages/*
  # Examples join the recursive scripts on purpose, so CI type-checks the demo.
  # Like every package, they need `pnpm build:dev` first: the content-mapper
  # demo's `check:types` runs the built `@utilize/content-mapper` mapper and
  # passes `--runExternalCode` itself.
  - examples/*
  - playground

# Pin every install to an exact version (no ^ / ~ ranges) when adding a dependency.
saveExact: true

# Shared dependency versions. Upgrade here once; packages reference "catalog:".
catalog:
  '@apidevtools/json-schema-ref-parser': 16.0.8
  '@cloudflare/oxlint-config': 0.2.0
  '@total-typescript/tsconfig': 1.0.4
  '@types/node': 24.19.2
  '@vitest/coverage-v8': 5.1.1
  '@vitest/ui': 5.1.1
  effect: 4.1.5
  fallow: 3.45.0
  fallow-type-aware: 3.45.0
  oxfmt: 0.79.0
  oxlint: 1.94.0
  tsdown: 0.23.7
  tsrs: 7.1.0-beta.tsrs5
  typescript: 7.0.2
  vitest: 5.1.1
  zod: 4.6.7

# Supply-chain guardrails for registry dependencies.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
# tsrs switched from staged publish to a trusted publisher in 7.1.0-beta.*. Both
# are the same oxc maintainer, but pnpm treats the switch as a trust downgrade.
trustPolicyExclude:
  - tsrs
blockExoticSubdeps: true

# monaco-editor@0.57.0 pins dompurify to exactly 3.4.15, which is affected by
# critical and high XSS advisories (GHSA-cg2g-xh64-v4q7, GHSA-mrv2-3pqr-j5jr).
# Remove this override once monaco-editor depends on dompurify >=3.4.17.
overrides:
  dompurify: '^3.4.18'

# GHSA-fc5q-39xc-vjpf is disputed upstream and revoked by Snyk; picomatch has
# no patched release yet. Without this the weekly Audit workflow stays red for
# a dev-only advisory. Remove it once 4.0.8 ships or the advisory is withdrawn.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf

# Only these reviewed packages may run install scripts.
strictDepBuilds: true
allowBuilds:
  '@swc/core': true
  esbuild: true
