name: Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run code quality tools and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-shell-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-shell-

      - name: Install Playwright browsers
        # Browser tests run headless, so the headless shell is enough and skips
        # the `--with-deps` apt install (fonts and X libraries) that dominated
        # the job runtime on image updates. See playground/vitest.config.ts.
        run: pnpm --filter playground exec playwright install --only-shell chromium

      - name: Build packages
        run: pnpm build:dev

      - name: Check format
        run: pnpm run check:format

      - name: Lint
        run: pnpm run check:lint

      - name: Check types
        run: pnpm run check:types

      - name: Test
        run: pnpm run ci:test

      - name: Check coverage badges
        run: pnpm run check:coverage-badge

  # Dependency audits run weekly in audit.yml. Keeping them out of the pull
  # request workflow means an advisory without a published fix cannot block
  # every pull request.
  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
          show-openssf-scorecard: false
