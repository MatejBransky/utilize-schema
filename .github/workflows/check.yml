name: Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run code quality tools and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Use Node.js 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:dev

      - name: Check format
        run: pnpm run check:format

      - name: Lint
        run: pnpm run check:lint

      - name: Check types
        run: pnpm run check:types

      - name: Test
        run: pnpm run ci:test

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Use Node.js 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
