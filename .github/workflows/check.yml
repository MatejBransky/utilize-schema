name: Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run code quality tools and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-shell-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-shell-

      - name: Install Playwright browsers
        # Browser tests run headless, so the headless shell is enough and skips
        # the `--with-deps` apt install (fonts and X libraries) that dominated
        # the job runtime on image updates. See playground/vitest.config.ts.
        run: pnpm --filter playground exec playwright install --only-shell chromium

      - name: Build packages
        run: pnpm build:dev

      - name: Check format
        run: pnpm run check:format

      - name: Lint
        run: pnpm run check:lint

      - name: Check types
        run: pnpm run check:types

      - name: Test
        run: pnpm run ci:test:coverage

      - name: Check coverage badges
        run: pnpm run check:coverage-badge

      - name: Check conformance badges
        run: pnpm run check:suite-badge

      - name: Check Fallow health badge
        run: pnpm run check:fallow-badge

      # The combined run consults the TypeScript checker too: the config sets
      # `typeAware.enabled`, so dead code, health and duplication are judged on
      # the same semantic program and measured coverage. A type-aware run accepts
      # only machine and human formats, so the run writes JSON, the gate reads the
      # documented `gate_outcomes` field (a machine format never sets its exit
      # code on findings), and the step summary is rendered from the same file.
      #
      # `--reuse-coverage` merges the coverage the test step just measured
      # instead of running the whole suite a second time.
      - name: Full Fallow run with measured coverage
        run: |
          pnpm fallow:coverage --reuse-coverage --format json --quiet --output-file .fallow/full.json

      # `--warn` makes a warning fail too: this repository treats a `warn` rule
      # as something to fix, not as background noise.
      - name: Gate the Fallow result
        if: always() && hashFiles('.fallow/full.json') != ''
        run: |
          node scripts/fallow-gate.mjs --warn .fallow/full.json

      - name: Render the Fallow step summary
        if: always() && hashFiles('.fallow/full.json') != ''
        run: |
          pnpm exec fallow report --from .fallow/full.json --format github-summary >> "$GITHUB_STEP_SUMMARY"

  fallow:
    name: Fallow audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      # The sticky PR comment needs `pull-requests: write`, the Fallow Check Run
      # needs `checks: write`. Both are scoped to this PR-only job.
      pull-requests: write
      checks: write

    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Fallow reads the packages in `node_modules`. Without an install the run
      # records `node-modules-missing` and degrades every analysis that depends
      # on resolution, so the verdict is computed over less than the whole
      # project and the comment understates the findings.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit introduced findings
        uses: fallow-rs/fallow@b802ddc49a09ad9df4e9894cdd465f5b51b1b0c8 # v3.45.0
        with:
          command: audit
          gate: new-only
          fail-on-issues: true
          fail-on-empty-analysis: true
          comment: true
          sarif: true
          annotations: true

      # The action treats an audit verdict of `warn` as a pass, by design: warn
      # means "warn-tier findings only". This repository fails on those findings
      # too, except the review-only diff-risk rules (`added-dependency` and
      # `added-suppression`), which `fallow-gate.mjs` lets through. The step is
      # skipped when the action stopped before writing the result; that run has
      # already failed on its error findings.
      - name: Fail on warning findings
        if: always() && hashFiles('fallow-results.json') != ''
        run: |
          node scripts/fallow-gate.mjs --warn fallow-results.json

  security-fallow:
    name: Fallow security gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Same reason as the audit job: without an install the security gate is
      # computed over a degraded, partially resolved project.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A change can add a candidate on an added line (`new`) and can also make
      # an existing candidate reachable from an entry point
      # (`newly-reachable`). Neither implies the other, so both gates run; only
      # the second one uploads SARIF so code scanning gets one result set.
      - name: Gate new security candidates
        uses: fallow-rs/fallow@b802ddc49a09ad9df4e9894cdd465f5b51b1b0c8 # v3.45.0
        with:
          command: security
          security-gate: new
          fail-on-issues: true
          fail-on-empty-analysis: true
          annotations: true

      # Existing low candidates are reviewed in the test-only evaluator. The
      # gate only fails when a change makes a candidate newly runtime-reachable.
      # Annotations stay on the `new` gate only: its findings sit on the lines
      # the change adds, while this gate reports pre-existing lines that the same
      # annotations would duplicate.
      - name: Gate newly reachable security candidates
        uses: fallow-rs/fallow@b802ddc49a09ad9df4e9894cdd465f5b51b1b0c8 # v3.45.0
        with:
          command: security
          security-gate: newly-reachable
          fail-on-issues: true
          fail-on-empty-analysis: true
          sarif: true
          annotations: false

  # Dependency audits run weekly in audit.yml. Keeping them out of the pull
  # request workflow means an advisory without a published fix cannot block
  # every pull request.
  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
          show-openssf-scorecard: false
