name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Only Matej can approve this environment. Phil may trigger the workflow,
    # but the publish never starts without Matej's approval.
    environment:
      name: npm-publish

    steps:
      - name: Checkout code repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Use Node.js 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Publish packages
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm ci:version
          commit-message: 'chore: update versions'
          pr-title: 'chore: update versions'
          publish-script: pnpm ci:publish
          github-token: ${{ secrets.GITHUB_TOKEN }}
